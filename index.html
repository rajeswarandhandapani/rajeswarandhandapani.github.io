<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Strict CSP: all data, transcripts, and recorded audio stay on this origin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>English Fluency</title>
  <meta name="description" content="Private daily 25-minute American English speaking and listening coach for a 12-week fluency plan.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">English Fluency</span>
    <nav aria-label="Main">
      <button type="button" data-view="today">Today</button>
      <button type="button" data-view="progress">Progress</button>
      <button type="button" data-view="reference">Reference</button>
      <button type="button" data-view="data">Data</button>
    </nav>
  </header>
  <main id="main"></main>
  <div id="timer-bar" class="timer-bar" role="timer" aria-label="Speaking timer" hidden>
    <span id="timer-label">Speak</span>
    <b id="timer-time">2:00</b>
    <button type="button" data-timer="-30" aria-label="30 seconds less">−30</button>
    <button type="button" data-timer="30" aria-label="30 seconds more">+30</button>
    <button type="button" data-timer="stop">Stop</button>
    <div class="timer-track" aria-hidden="true"><i id="timer-fill"></i></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
