<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The page may only talk to its own origin, so transactions have nowhere to be sent. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Money Manager</title>
  <meta name="description" content="Private monthly expense reports from bank exports.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">Money Manager</span>
    <nav aria-label="Main">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="tx">Transactions</button>
      <button data-view="import">Import</button>
      <button data-view="data">Data</button>
    </nav>
  </header>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="drop-veil" aria-hidden="true">Drop files to import</div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
